[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-recommendation-engine"
version = "0.0.0"
description = "Projet pédagogique de recommandation de jeux Steam"
readme = "README.md"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
